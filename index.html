  else if(shape==='shield'){g.moveTo(-43,-40);g.quadraticCurveTo(0,-50,43,-40);g.lineTo(41,0);g.quadraticCurveTo(36,34,0,56);g.quadraticCurveTo(-36,34,-41,0);g.closePath()}

  DAISIES.forEach(d=>daisy(d[0],d[1],d[2]));
  if(topY>0.5){const rg=ctx.createLinearGradient(0,0,0,topY);rg.addColorStop(0,'#7b4fd6');rg.addColorStop(1,'#a77cf0');ctx.fillStyle=rg;ctx.fillRect(0,0,W,topY);
    ctx.fillStyle='rgba(255,111,181,.35)';for(let x=-20;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+14,0);ctx.lineTo(x+14-topY*.5,topY);ctx.lineTo(x-topY*.5,topY);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#ffd96a';for(let x=0;x<=W;x+=20){ctx.beginPath();ctx.arc(x+10,topY,7,0,Math.PI);ctx.fill()}
    if(roofMsg){ctx.save();ctx.beginPath();ctx.rect(0,0,W,topY-2);ctx.clip();drawRoofMsg();ctx.restore()}
    ctx.strokeStyle='#5b2a9e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,topY);ctx.lineTo(W,topY);ctx.stroke()}
  if(danger/DMAX>.6){ctx.globalAlpha=Math.min(1,(danger/DMAX-.6)/.25)*(RM?1:.65+.35*Math.sin(performance.now()/180));ctx.strokeStyle='rgba(225,60,140,.85)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,DEAD);ctx.lineTo(W,DEAD);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
  grid&&grid.forEach((row,r)=>row.forEach((v,c)=>{if(v!=null)put(v,px(r,c),py(r))}));
  if(state==='play'){
    ctx.strokeStyle='#3a1470';ctx.lineWidth=4;ctx.setLineDash([2,10]);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(W/2,LY);ctx.lineTo(W/2+Math.cos(aim)*150,LY-Math.sin(aim)*150);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.fillStyle='#ffd96a';ctx.beginPath();ctx.arc(W/2,H+6,50,Math.PI,0);ctx.fill();ctx.fillStyle='#ff6fb5';ctx.beginPath();ctx.arc(W/2,H+6,42,Math.PI,0);ctx.fill();
  if(cur!=null&&!shot&&state==='play')put(cur,W/2,LY);
  {const wait=shot?cur:nxt;if(wait!=null&&state==='play'){ctx.globalAlpha=.85;put(wait,WX,H-24,.8);ctx.globalAlpha=1;ctx.font='600 11px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillStyle='#3a1470';ctx.fillText('next',WX,H-46)}}
  if(shot)put(shot.k,shot.x,shot.y);
  pops.forEach(p=>{p.t+=.08;ctx.globalAlpha=Math.max(0,1-p.t);put(p.k,p.x,p.y,1+p.t*.6);ctx.globalAlpha=1});
  pops=pops.filter(p=>p.t<1);
  falling.forEach(f=>{f.vy+=.45;f.x+=f.vx;f.y+=f.vy;put(f.k,f.x,f.y)});
  falling=falling.filter(f=>f.y<H+R*2);
  drawFloats();
}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function daisy(x,y,r){ctx.save();ctx.translate(x,y);ctx.globalAlpha=.9;ctx.fillStyle='#fff';for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.ellipse(0,r*.9,r*.38,r*.75,0,0,7);ctx.fill()}ctx.fillStyle='#ffd96a';ctx.beginPath();ctx.arc(0,0,r*.5,0,7);ctx.fill();ctx.restore()}
function addFloat(x,y,txt,col,size){floats.push({x:Math.max(60,Math.min(W-60,x)),y,txt,col,size,t:0})}
function drawFloats(){
  floats.forEach(f=>{f.t+=.016;f.y-=.6;ctx.globalAlpha=Math.max(0,1-f.t/1.4);ctx.font='700 '+f.size+'px Fredoka, sans-serif';ctx.textAlign='center';
    ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)});
  ctx.globalAlpha=1;floats=floats.filter(f=>f.t<1.4);
}
const WX=W-44,ROOF_TOP=26;
let roofLines=null,roofFs=40,roofFor='';
try{document.fonts&&document.fonts.ready.then(()=>{roofFor=''})}catch(e){}
const ROOF_FONT="Impact, Anton, 'Arial Narrow', sans-serif";
let roofBottom=300;
function placeRoof(){
  // where the curtain will be when this level is about to be lost, so the phrase completes near the end
  let rows=0;grid.forEach((row,r)=>{if(row.some(v=>v!=null))rows=r+1});
  roofBottom=Math.max(ROOF_TOP+60,Math.min(H*.55,DEAD-(rows*RH+R*2)-18));roofFor='';
}
function layoutRoof(){
  const words=roofMsg.split(' ');let lines=[roofMsg];
  if(roofMsg.length>12&&words.length>1){let best=null;for(let k=1;k<words.length;k++){const a=words.slice(0,k).join(' '),b=words.slice(k).join(' '),d=Math.abs(a.length-b.length);if(!best||d<best.d)best={d,l:[a,b]}}lines=best.l}
  ctx.font='100px '+ROOF_FONT;const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));
  roofFs=Math.floor(100*(W-28)/mw);
  const maxH=roofBottom-ROOF_TOP;if(lines.length*roofFs*1.0>maxH)roofFs=Math.floor(maxH/lines.length);
  roofLines=lines;roofFor=roofMsg;
}
function drawRoofMsg(){
  if(roofFor!==roofMsg)layoutRoof();
  // printed on the curtain: moves down with it, so the bottom of the text appears first
  const n=roofLines.length,lh=roofFs*1.0,top=roofBottom-n*lh+(topY-(roofBottom+14));
  ctx.font=roofFs+'px '+ROOF_FONT;ctx.textAlign='center';ctx.textBaseline='top';ctx.lineJoin='round';
  ctx.lineWidth=Math.max(4,roofFs*.07);ctx.strokeStyle='#3a1470';ctx.fillStyle='#fff';
  roofLines.forEach((l,k)=>{const y=top+k*lh+roofFs*.04;ctx.strokeText(l,W/2,y);ctx.fillText(l,W/2,y)});
}



const ROOF_MSGS=['Deleuze would say','Let\u2019s Go Celtics','Will Rules','Techno','Tolstoy','Let\u2019s launch over it','I don\u2019t even have Facebook'];
function swapPieces(){if(state==='play'&&!shot&&cur!=null&&nxt!=null){[cur,nxt]=[nxt,cur]}}
function put(k,x,y,s=1){const sp=sprite(k);ctx.drawImage(sp,x-R*1.6*s,y-R*1.6*s,R*3.2*s,R*3.2*s)}
function loop(){step();draw();requestAnimationFrame(loop)}

const board=$('board');
function setAim(e){
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  aim=Math.min(Math.PI-.15,Math.max(.15,Math.atan2(LY-y,x-W/2)));
}
let down=false;
function boardXY(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
function onWait(e){const [x,y]=boardXY(e);return Math.hypot(x-WX,y-(H-24))<30}
board.addEventListener('pointerdown',e=>{if(state!=='play')return;if(onWait(e)){swapPieces();down=false;return}down=true;setAim(e)});
board.addEventListener('pointermove',e=>{if(state==='play'&&(down||e.pointerType==='mouse'))setAim(e)});
board.addEventListener('pointerup',e=>{if(!down)return;down=false;setAim(e);fire()});
board.addEventListener('pointercancel',()=>{down=false});
document.addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(e.key==='ArrowLeft')aim=Math.min(Math.PI-.15,aim+.05);
  else if(e.key==='ArrowRight')aim=Math.max(.15,aim-.05);
  else if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();fire()}
});
$('go').addEventListener('click',()=>{
  if(state==='won')level++;else{level=1;score=0}
  $('ov').hidden=true;document.body.classList.add('playing');if(musicOn)Music.start();startLevel();
});
$('restart').addEventListener('click',()=>{
  if(score>0&&qualifies(score)&&(state==='play'||state==='won')){
    const fin=score;state='lost';shot=null;
    show('Game over','You ended on level '+level+' with '+fin+' points.','Play again');offerScore(fin);return}
  level=1;score=0;$('ov').hidden=true;document.body.classList.add('playing');if(musicOn)Music.start();startLevel()});


function cast(){
  const items=COLORS.map((c,i)=>({k:i,n:NAMES[i]})).concat(['W','T','S'].map(k=>({k,n:SPECIAL[k],t:SPECIAL_TIP[k]})));
  $('cast').innerHTML=items.map((it,i)=>'<div class="pc" title="'+(it.t||'')+'"><canvas width="96" height="96" data-i="'+i+'"></canvas><span></span></div>').join('');
  $('cast').querySelectorAll('.pc').forEach((el,i)=>{
    el.querySelector('span').textContent=items[i].n;
    const g=el.querySelector('canvas').getContext('2d');g.drawImage(sprite(items[i].k),0,0,96,96);
  });
}
Promise.all(Object.values(imgs).map(im=>im.decode?im.decode().catch(()=>{}):0)).then(()=>{for(const k in sprites)delete sprites[k];cast()});
const LSK='lbpop-scores',LSN='lbpop-name';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LB={list:[],mine:[],shared:false,arcade:false,db:null,me:null,pending:0,lastAt:0};
const SUPA=!!(SUPABASE_URL&&SUPABASE_KEY);
const sbH=SUPABASE_KEY.startsWith('sb_')?{apikey:SUPABASE_KEY}:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
function sortTrim(a){return a.filter(e=>e&&typeof e.score==='number'&&typeof e.name==='string').slice().sort((x,y)=>y.score-x.score).slice(0,10)}
LB.list=sortTrim(lsGet(LSK,[]));
function renderLB(){
  const ol=$('lbList');ol.textContent='';
  if(!LB.list.length){const li=document.createElement('li');li.className='empty';li.textContent='No scores yet. Be the first!';ol.appendChild(li)}
  LB.list.forEach((e,i)=>{const li=document.createElement('li');if(e.at===LB.lastAt)li.className='me';
    const r=document.createElement('span');r.className='rk';r.textContent=(i+1)+'.';
    const n=document.createElement('span');n.className='nm';n.textContent=e.name;
    const s=document.createElement('b');s.textContent=String(e.score);li.append(r,n,s);ol.appendChild(li)});
  $('lbNote').textContent=LB.arcade?'Arcade high scores: everyone, everywhere':'Saved on this phone';
}
function qualifies(sc){return sc>0&&(LB.list.length<10||sc>LB.list[LB.list.length-1].score)}
function offerScore(sc){
  if(!qualifies(sc))return;
  LB.pending=sc;$('hsName').value=lsGet(LSN,'');$('hsForm').hidden=false;
  setTimeout(()=>{try{$('hsName').focus()}catch(e){}},50);
}
async function saveScore(name,sc){
  const e={name:name.slice(0,16),score:sc,at:Date.now()};LB.lastAt=e.at;lsSet(LSN,name);
  if(SUPA){
    try{const r=await fetch(SUPABASE_URL+'/rest/v1/scores',{method:'POST',headers:{...sbH,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name:e.name,score:sc})});
      if(r.ok){LB.arcade=true;LB.list=sortTrim([...LB.list,e]);renderLB();loadArcade();return}}catch(err){}
  }
  const loc=sortTrim([...lsGet(LSK,[]),e]);lsSet(LSK,loc);LB.list=loc;renderLB();
}
$('hsForm').addEventListener('submit',ev=>{ev.preventDefault();
  const name=$('hsName').value.trim()||'Mystery guest';const sc=LB.pending;if(!sc)return;
  LB.pending=0;$('hsForm').hidden=true;saveScore(name,sc)});
async function loadArcade(){
  if(!SUPA)return false;
  try{const r=await fetch(SUPABASE_URL+'/rest/v1/scores?select=name,score,created_at&order=score.desc&limit=10',{headers:sbH});
    if(!r.ok)return false;const rows=await r.json();if(!Array.isArray(rows))return false;
    LB.arcade=true;LB.list=sortTrim(rows.map(x=>({name:String(x.name||''),score:Number(x.score)||0,at:Date.parse(x.created_at)||0})));
    if(LB.lastAt&&!LB.list.some(x=>x.at===LB.lastAt)){}renderLB();return true}catch(e){return false}
}
if(SUPA)setInterval(()=>{if(!$('ov').hidden&&LB.arcade)loadArcade()},30000);
if(SUPA)loadArcade();
let musicOn=lsGet('lbpop-music',true);
function musLabel(){$('mus').textContent=musicOn?'Music on':'Music off';$('mus').setAttribute('aria-pressed',String(musicOn))}
musLabel();
$('swap').addEventListener('click',swapPieces);
$('mus').addEventListener('click',()=>{musicOn=!musicOn;lsSet('lbpop-music',musicOn);musLabel();if(musicOn)Music.start();else Music.stop()});
document.addEventListener('pointerdown',()=>{if(musicOn&&document.body.classList.contains('playing')&&!Music.on)Music.start()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)Music.stop();else if(musicOn&&document.body.classList.contains('playing'))Music.start()});
renderLB();
level=1;score=0;grid=null;loop();
}
</script>
